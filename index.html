<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박재열 변론 슬라이드</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout concept: a 1280x720 slide canvas scaled to the window under a thin toolbar.
   Content slides read as claim title -> evidence rows with source chips.
   Pending edits (after the indictment arrives) show as hatched top strips, colored chips and a dashed memo box. */
:root{
  --bg:#E7EBEF; --paper:#FBFCFD; --ink:#14202B; --ink2:#43505C; --ink3:#697684;
  --rule:#D3DAE0; --rule2:#E5E9ED;
  --accent:#1D4E6E; --accent-ink:#FFFFFF; --accent-soft:#E1ECF3;
  --good:#17684C; --good-soft:#DFF0E7; --bad:#9F3626; --bad-soft:#F7E5E1;
  --warn:#7F5700; --warn-soft:#F6ECCD; --none:#56626E; --none-soft:#E9EDF0;
  --ff-fix:#B3225B; --fi-fix:#FFFFFF; --ff-law:#5B3FA6; --fi-law:#FFFFFF;
  --ff-orig:#A85A00; --fi-orig:#FFFFFF; --ff-ocr:#0E7388; --fi-ocr:#FFFFFF;
  --ff-infer:#4A5F7A; --fi-infer:#FFFFFF; --ff-hold:#14202B; --fi-hold:#FFFFFF; --ff-new:#2E6B3A; --fi-new:#FFFFFF;
  --shadow:0 1px 2px rgba(20,32,43,.10),0 10px 30px rgba(20,32,43,.12);
  --serif:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo','Batang',serif;
  --sans:'IBM Plex Sans KR','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --paper:#151C23; --ink:#E8EEF3; --ink2:#B0BCC7; --ink3:#8795A2;
    --rule:#2B3640; --rule2:#222C35;
    --accent:#86B8D9; --accent-ink:#0B1620; --accent-soft:#1B2B38;
    --good:#6FCDA7; --good-soft:#15291F; --bad:#F29A89; --bad-soft:#341B17;
    --warn:#E9C66B; --warn-soft:#2E2813; --none:#A5B0BB; --none-soft:#202931;
    --ff-fix:#F58AB0; --fi-fix:#2A0A17; --ff-law:#BBA8F4; --fi-law:#1E1240;
    --ff-orig:#F2AE55; --fi-orig:#2B1A00; --ff-ocr:#62C6D9; --fi-ocr:#04262D;
    --ff-infer:#AFC2DA; --fi-infer:#10202F; --ff-hold:#E6EDF3; --fi-hold:#0E161D; --ff-new:#8CD49B; --fi-new:#0C2312;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --paper:#151C23; --ink:#E8EEF3; --ink2:#B0BCC7; --ink3:#8795A2;
  --rule:#2B3640; --rule2:#222C35;
  --accent:#86B8D9; --accent-ink:#0B1620; --accent-soft:#1B2B38;
  --good:#6FCDA7; --good-soft:#15291F; --bad:#F29A89; --bad-soft:#341B17;
  --warn:#E9C66B; --warn-soft:#2E2813; --none:#A5B0BB; --none-soft:#202931;
  --ff-fix:#F58AB0; --fi-fix:#2A0A17; --ff-law:#BBA8F4; --fi-law:#1E1240;
  --ff-orig:#F2AE55; --fi-orig:#2B1A00; --ff-ocr:#62C6D9; --fi-ocr:#04262D;
  --ff-infer:#AFC2DA; --fi-infer:#10202F; --ff-hold:#E6EDF3; --fi-hold:#0E161D; --ff-new:#8CD49B; --fi-new:#0C2312;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
a{color:inherit}
button{font:inherit}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:38px}
.brand{font-family:var(--serif);font-weight:700;font-size:15px;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.sp{flex:1}
.cover .body{display:flex;flex-direction:column;justify-content:center}
.btn{font-size:13px;font-weight:500;padding:6px 12px;min-height:34px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.xr:focus-visible,.ovc:focus-visible,.goto:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.nav{width:38px;padding:6px 0;font-size:16px}
.cnt{min-width:70px;text-align:center;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* stage */
.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.fit{position:relative}
.canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);border-radius:4px;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:30px 56px 20px;word-break:keep-all;overflow-wrap:break-word}
.slide.on{display:flex;animation:fi .18s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

.hb{position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(135deg,var(--hc) 0 9px,transparent 9px 18px)}
.top{display:flex;align-items:center;gap:10px;min-height:24px;font-size:12.5px;color:var(--ink3);letter-spacing:.03em}
.top .part{font-weight:600;color:var(--ink2)}
.lks{display:inline-flex;gap:4px}
.lk.w{width:auto;padding:0 8px}
.lk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.ribbon{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.fchip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--ff);color:var(--fi);white-space:nowrap;letter-spacing:0}
.fchip.fix{--ff:var(--ff-fix);--fi:var(--fi-fix)}.fchip.law{--ff:var(--ff-law);--fi:var(--fi-law)}
.fchip.orig{--ff:var(--ff-orig);--fi:var(--fi-orig)}.fchip.ocr{--ff:var(--ff-ocr);--fi:var(--fi-ocr)}
.fchip.infer{--ff:var(--ff-infer);--fi:var(--fi-infer)}.fchip.hold{--ff:var(--ff-hold);--fi:var(--fi-hold)}.fchip.new{--ff:var(--ff-new);--fi:var(--fi-new)}
.ttl{font-family:var(--serif);font-weight:700;line-height:1.32;margin:8px 0 6px;text-wrap:balance}
.ttl.s1{font-size:36px}.ttl.s2{font-size:31px}.ttl.s3{font-size:26px}.ttl.s4{font-size:22px}
.lead{margin:0 0 8px;font-size:16.5px;line-height:1.5;color:var(--ink2)}
.body{flex:1;min-height:0;overflow:auto}
.memo{margin-top:8px;border:1.5px dashed var(--ink3);border-left:7px solid var(--hc);border-radius:5px;padding:6px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4;background:var(--paper)}
.mr{display:flex;gap:9px;align-items:baseline}
.mr .fchip{flex:none}
.mr .mt{min-width:0}
.mref{flex:none;margin-left:auto;padding-left:10px;font-size:12px;color:var(--ink3);white-space:nowrap}
.foot{display:flex;gap:16px;margin-top:8px;padding-top:6px;border-top:1px solid var(--rule2);font-size:11.5px;color:var(--ink3)}
body.noflags .fx{display:none!important}

/* evidence rows */
.evs{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:14px;padding:9px 0;border-top:1px solid var(--rule2)}
.ev:first-child{border-top:1px solid var(--rule)}
.mkc{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.k-g .mkc{background:var(--good-soft);color:var(--good)}
.k-b .mkc{background:var(--bad-soft);color:var(--bad)}
.k-x .mkc{background:var(--warn-soft);color:var(--warn)}
.k-n .mkc{background:var(--none-soft);color:var(--none)}
.evt{font-size:var(--fs,18px);line-height:1.55}
.k-n .evt{color:var(--ink2)}
.dense .evt{--fs:16px}
.dense .ev{padding:7px 0}
.srcs{display:flex;flex-wrap:wrap;gap:5px 6px;margin-top:5px}
.src{font-size:12.5px;line-height:1.4;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.src b{font-weight:600}
.src i{font-style:normal;font-size:11px;margin-left:6px;padding-left:6px;border-left:1px solid currentColor}
.src[class*="st-"]{background:transparent;border:1px dashed var(--ink3);color:var(--ink2)}
.xr{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.evs.in .ev{grid-template-columns:minmax(0,1fr);row-gap:4px;padding:7px 0}
.evs.in .evt{font-size:var(--fs,15px);line-height:1.5}
.evs.in .evb{display:block}
.evs.in .srcs{display:inline;margin:0}
.evs.in .src{display:inline-block;margin:3px 5px 0 0}
.evs.in .evt{display:inline}
.evs.in .evt::after{content:' '}
.cards.big .evs.in .evt{--fs:16.5px}
.cards.big .card h3{font-size:20px}
.cards.big .card{gap:8px}
.cards.big .ev{padding:9px 0}

/* cards */
.cards{display:grid;gap:14px;margin-bottom:8px}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-width:0;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.card.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card header{display:flex;gap:10px;align-items:flex-start}
.card h3{margin:0;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.4}
.cards.c4 .card h3,.cards.g2x2 .card h3{font-size:16.5px}
.cn{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.go{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}
.cards.g2x2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.g2x2 .evs.in .evt{--fs:14px}
.cards.g2x2 .card{padding:11px 14px;gap:3px}
.cards.c4 .evs.in .evt{--fs:14px}

/* cover */
.cover{justify-content:center}
.cv-t{margin:14px 0 8px;font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.25;text-wrap:balance}
.cv-s{font-size:19px;color:var(--ink2)}
.cv-h{margin:26px 0 8px;font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--ink3)}
.cv-chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cv-link{padding:9px 2px 0;border-top:3px solid var(--accent);font-size:13px;line-height:1.5;color:var(--ink2)}
.cv-link b{display:block;margin-bottom:3px;font-size:15px;color:var(--ink)}
.cv-note{margin-top:20px;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-size:14.5px;line-height:1.5;font-weight:500}

/* chain diagram (slide 3) */
.chain{display:flex;align-items:stretch;gap:0;margin:6px 0 12px}
.cn-box{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.cn-box h4{margin:0 0 3px;font-size:18px;font-family:var(--serif)}
.cn-box p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.cn-box.me{border-color:var(--accent);background:var(--accent-soft)}
.cn-arrow{flex:none;width:34px;display:grid;place-items:center;color:var(--ink3);font-size:20px}

/* steps strip */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:2px 0 8px}
.step{position:relative;padding:22px 12px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.step::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--rule)}
.step::after{content:"";position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.step.b::after{background:var(--bad)}.step.g::after{background:var(--good)}.step.x::after{background:var(--warn)}
.step .tm{display:block;font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.step .ss{display:block;margin-top:4px;font-size:12px;color:var(--ink3)}

/* timeline swimlane */
.tlg{margin-top:2px}
.tl-axis{position:relative;height:18px;margin:0 14px 0 118px}
.tl-tick{position:absolute;top:2px;transform:translateX(-50%);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl-lane{display:flex;height:36px;border-top:1px solid var(--rule2)}
.tl-lane:last-child{border-bottom:1px solid var(--rule2)}
.tl-lane.me{background:var(--accent-soft)}
.tl-lab{flex:none;width:104px;display:flex;align-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.tl-lane.me .tl-lab{color:var(--accent)}
.tl-in{position:relative;flex:1;margin:0 14px}
.tl-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--rule2)}
.tl-dot{position:absolute;top:50%;width:23px;height:23px;margin:-11.5px 0 0 -11.5px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--none);color:var(--paper);font-variant-numeric:tabular-nums}
.tl-dot.g,.tl-bar.g{background:var(--good)}.tl-dot.b,.tl-bar.b{background:var(--bad)}.tl-dot.x,.tl-bar.x{background:var(--warn)}
.tl-bar{position:absolute;top:50%;min-width:26px;height:24px;margin-top:-12px;border-radius:12px;background:var(--none);color:var(--paper);display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:700}
.tl-key{columns:2;column-gap:28px;margin-top:6px;font-size:12px;line-height:1.35}
.tl-key div{break-inside:avoid;display:flex;gap:8px;padding:1px 0}
.tl-key .kn{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--none);color:var(--paper)}
.tl-key .kn.g{background:var(--good)}.tl-key .kn.b{background:var(--bad)}.tl-key .kn.x{background:var(--warn)}
.tl-key time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tl-key small{color:var(--ink3);font-size:11.5px;white-space:nowrap}

/* time bar (slide 17) */
.tb17{position:relative;height:116px;margin:6px 30px 4px}
.tb17 .tk{position:absolute;top:70px;transform:translateX(-50%);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tb17 .ln{position:absolute;top:62px;left:0;right:0;height:1px;background:var(--rule)}
.tb17 .rg{position:absolute;top:22px;height:34px;border-radius:6px;background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:13px;font-weight:600;white-space:nowrap}
.tb17 .mkr{position:absolute;top:0;bottom:46px;width:0;border-left:2px dashed var(--accent)}
.tb17 .mkr.alt{border-left-color:var(--warn)}
.tb17 .mkr span{position:absolute;top:-2px;left:6px;font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.tb17 .mkr.alt span{color:var(--warn);left:auto;right:6px}

/* ladder (slide 30) */
.lad{display:flex;flex-direction:column;gap:8px}
.rung{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border:1px solid var(--rule);border-radius:8px}
.rung .rn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.rung.law{border-style:dashed;border-color:var(--ff-law)}
.rung .rt{font-size:17px;line-height:1.5}
.rung .rs{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:330px}

/* summary rows (slide 29) */
.srow{display:grid;grid-template-columns:40px 190px minmax(0,1fr) 150px;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--rule)}
.srow:last-child{border-bottom:1px solid var(--rule)}
.srow .sn{font-size:22px;font-weight:700;color:var(--accent)}
.srow .sh{font-family:var(--serif);font-weight:700;font-size:18px}
.srow .st{font-size:16.5px;line-height:1.55}
.srow .sg{font-size:13px;color:var(--ink2)}

/* appendix tables / lists */
.tabw{overflow:auto}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.5}
.tb th{position:sticky;top:0;text-align:left;font-weight:600;color:var(--ink2);background:var(--paper);border-bottom:2px solid var(--ink);padding:6px 8px}
.tb td{vertical-align:top;border-bottom:1px solid var(--rule);padding:7px 8px}
.tb td.nm{font-weight:700;white-space:nowrap}
.tb td.sm{color:var(--ink2)}
.tb .rf{display:block;margin-top:4px}
.toc{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.goto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;width:100%;text-align:left;padding:14px 18px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer}
.goto:hover{border-color:var(--accent)}
.goto b{font-family:var(--serif);font-size:19px}
.goto span{display:block;margin-top:3px;font-size:13.5px;color:var(--ink2)}
.goto em{font-style:normal;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.srcl{columns:4;column-gap:20px;font-size:12px;line-height:1.4}
.srcl div{break-inside:avoid;padding:4px 0;border-bottom:1px solid var(--rule2);overflow-wrap:anywhere}
.srcl b{font-weight:600;color:var(--accent)}
.srcl small{display:block;color:var(--ink3);font-size:11.5px}
.work{columns:2;column-gap:28px;font-size:13px;line-height:1.45}
.we{break-inside:avoid;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--rule2);cursor:pointer}
.we .wn{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.we b{font-weight:600}
.we .wr{display:block;font-size:11.5px;color:var(--ink3)}
.steps2{margin:0 0 8px;padding-left:20px;font-size:14px;line-height:1.55;color:var(--ink2)}

/* overlays */
.ov{position:fixed;inset:0;z-index:70;overflow:auto;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:1180px;margin:0 auto}
.ov-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ov-h h2{margin:0;font-family:var(--serif);font-size:20px}
.ov h3{margin:20px 0 8px;font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--ink3)}
.ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ovc{display:flex;flex-direction:column;gap:6px;min-height:92px;padding:10px 12px;text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer}
.ovc.cur{outline:2px solid var(--accent)}

 {c:['15','2신속사는 평시 7군단 통제 아래 있어 박재열이 지시할 수 있는 위치였다','11권_2-1 p.5~6','지시할 수 있는 위치와 실제 지시는 구별. 실제 지시는 ‘의명’ 전제, 7군단은 계엄 임무 없음','11권_2-1 p.5~6·22; 11권_2-3 p.27','확인']},
 {c:['16','7군단 예하에서 실제 포고령 교육이 이루어짐: 수기사 01:25 사단장 지시 「계엄사 포고령: 전 지휘관 숙지 및 장병 교육」, 02:01 교육 완료 여부 보고 지시. 7공병여단 01:22 「숙독하고 … 행동화할 수 있도록 교육」, 01:30 교육 완료','3권_7 p.4~6','상급(군단·사단) 지시의 전파. 8기동사단은 「상급부대 지시사항을 그대로 전파한 것 외」 특이 활동 없음. 다른 군단 예하도 같은 시간대 교육(2군단 7포병여단 01:40). 7군단은 04:38~04:45 교육 불필요 지시','3권_7 p.4~5; 3권_2 p.21','확인'],f:[['LAW','공소장 나항','포고령 교육 전파와 부화수행(법리)']]},
 {c:['17','박재열: 국회 대치 장면을 보고 「큰일」, 국회가 의결을 하려 한다는 점을 인지, 국회에 나간 군인들은 「국회를 통제하려 하는 행위」를 하고 있다고 인지','11권_2-3 p.29~30','계엄군의 목적에 대한 인식과 박재열 자신의 목적은 구별. 같은 진술에서 의결 저지 목적이었는지는 「잘 모르겠습니다」. 01:10 지시는 ‘의명’ 전제','11권_2-3 p.28·30; 3권_7 p.3','확인(법리 ✕)'],f:[['LAW','공소장 가항','인식과 목적의 관계(법리)']]},
 {c:['18','적 도발 상황이 없었다는 참모 진술(공소장 「군사적 특이 사항이 없다」를 뒷받침)','11권_2-1 p.23; 11권_2-2 p.5~6','경계태세 2급이 발령된 상태였고 군단은 별도 정보 경로가 없었다(박재열). ‘특이 사항 없음’을 알 수 있었다는 것과 국헌문란 목적 인식은 별개(추론)','11권_2-3 p.28~29','확인 ▲ 추론 포함']},
 {c:['19','성은경: 지통실에서 군단장이 포고령을 「한번 읽어봐라, 다 들을 수 있도록」 지시','11권_1-3 p.12','포고령 내용 숙지는 지작사의 숙독·교육 지시를 전파하는 전제. 같은 진술인은 포고령이 이상하다는 반응을 기억(p.12~13)','11권_1-3 p.12~13; 3권_7 p.3','확인']},
 {c:['20','특검 수사보고: 일지 01:10 「항공부대 항공대기는 대대별 2대 임무수행 준비」가 2신속사 임무수행 지원일 가능성 배제 불가','10권_10-2 p.22','같은 보고서가 단편명령(경계태세 조치부호)에 따른 지시로 보인다고 적음. 「배제할 수 없음」은 추정 표현','10권_10-2 p.22','확인']},
 {c:['21','「포고령 교육은 계엄 사무 업무입니다」(지작사 소속 진술인) → 계엄 업무가 없다는 7군단이 계엄 사무를 했다는 반론 가능','3권_6 p.21 !n','지작사령관 지시의 전파이고 모든 군단이 같았음. 7군단은 04:38 교육 불필요 지시','3권_2 p.23~25; 3권_7 p.4','확인(진술인 성명 미확인)'],f:[['ORIG','3권_6','진술인 성명 확인']]}
 ]},

 {c:['12.3 23:18','지작사→각 군단','지작사령관 지시사항 하달(영장 서술): 지역계엄사령부 설치, 제1지구계엄사령부는 별도 화상망. 개소를 보고한 군단은 2·1·3·수도·5군단이고 7군단은 그 목록에 없음','9권_5 p.33~34; 6권_1 p.28~29','7군단 부재 ◎']},

 {c:['00:07경 이후','TV / 지작사','계엄군 국회 출동·체포 시도 장면 송출(공소장). 강호필도 TV 뉴스로 특전사 등의 국회 투입을 확인(영장 서술)','공소장 p.22; 9권_5 p.32','공소장·영장']},
 {c:['00:09','지작사↔계엄사령부','강호필이 박안수에게 전화해 지휘소 개소 중간보고, 지구계엄사 창설 지시를 받음(안보폰 통화내역 00:09경 1분 49초)','9권_5 p.33; 10권_9-3 p.51','박재열 무관']},
 {c:['00:31','지작사→예하 전 부대','지작사령관 승인 없는 부대 병력 이동 금지 지시(지작사 수정본 기재). 박재열은 회의 전 「전 부대 부대활동 중지, 다음날 훈련 및 부대 이동 중지」 전파를 기억. 권대원은 당시 직접 듣지 못했다고 진술','11권_2-3 p.7·10·13·32·43·50','◎ ※ 상황보고서 원문 미확인']},
 {c:['00:31','국방부장관→계엄사령관','김용현이 박안수에게 「국회에 경력과 병력 집중」 지시, 박안수가 투입 가능 부대로 2신속사 언급(영장 서술)','9권_5 p.34~35','특검 서사의 출발점, 박재열 무관']},
 {c:['00:31~01:03','지작사','지작사-군단 상황평가회의(3차) 주관','9권_5 p.33','중립']},
 {c:['00:42','지작사','강호필이 김용현 통화 직후 김주훈에게 2신속사 투입 가능 여부 확인, 김주훈은 계엄임무수행군 동원으로 보고 「제한된다」 답변(영장 서술). 박재열이 이를 알았다는 기록은 문서에서 확인되지 않음. 7권_6 p.22(시간대별 정리표)는 시각을 00:43경으로 기재','9권_5 p.35; 7권_6 p.22','✕']},
 {c:['00:40~00:55','지작사→군단장들','강호필 주요 지시·강조사항. 영장은 「신속대응사단은 의명 투입준비태세 유지」. 기록별로 7군단 일지 00:55 「합참 대테러부대 출동태세 유지(의명, 2신속대응사단)」, 3군단 멀티톡 01:02 11항, 수도군단 일지 00:30(1차 평가), 1군단 일지가 각기 다르게 적음. 7권_6 p.22(시간대별 정리표)는 3군단 멀티톡·수도군단 일지를 근거로 지작사령관 주요 지시를 00:36~00:44, 예하 군단장·사단장 계엄상황실 개소 보고를 00:47~00:55로 정리','9권_5 p.35; 10권_9-2 p.29~30; 6권_1 p.31; 10권_9-3 p.52; 7권_6 p.22; 3권_7 p.3','※ 시각·문구'],f:[['ORIG','매핑표 6절 4번','일지 원본(별도 관리) 열람']]},
 {c:['00:40~00:55','공소장','「제2신속대응사단은 출동을 준비하라」는 지시, 포고령 1호 교육·위반 시 처벌 교육 지시를 박재열이 수명했다고 서술','공소장 p.22~23','공소장 ※ 문구']},
 {c:['00:55경','7군단','박재열 진술: 00:40 회의는 기억이 불명확하고 강호필의 「지금 현재 대단히 조심해야 하는 상황」만 기억, 「신속대응사단이 의명 출동준비」 취지만 기억','11권_2-3 p.31~33·35~36','본인 진술']},
 {c:['01:00~01:10','7군단','군단장 주관 군단-사단 상황평가회의. 일지 01:10 항 3항 「계엄군 임무수행을 할 수 있도록 준비해야하고, 2신속대응사단은 임무부여 시 즉각 투입될 수 있도록 준비」, 4항 「포고문 관련 지휘관이 숙독하고 전 간부 교육할 수 있도록, 또한 포고문 내용이 실제 행동화 될 수 있도록 교육」(휴대폰 통제, 위반자 계엄법 처벌: 정치행위·가짜뉴스·허위사실 유포 금지)','3권_7 p.3~4; 공소장 p.22~23; 11권_2-3 p.33·36','▲ 핵심 불리 · 수사보고 발췌'],f:[['ORIG','매핑표 6절 4번','일지 원본(별도 관리) 열람']]},
 {c:['01:02~01:04','지작사(3군단 멀티톡)','지작사령관 지침 11항 「신속대응사단은 의명 투입준비태세 유지」(01:02), 포고문 1호 숙독·교육 및 「행동화 될 수 있도록」(01:03~01:04)','6권_1 p.31~32; 5권_1 p.13; 3권_2 p.23','※ 시각(공소장은 00:40~00:55)']},
 {c:['01:03','국회','해제요구 결의안 의결. 지작사 법무실장이 직후 강호필에게 「계엄과 관련된 지시도 하면 안 된다」 취지로 보고(영장 서술)','9권_5 p.35; 11권_1-1 p.18','※ 01:01(색인)'],f:[['ORIG','매핑표 6절 5번','01:01(강호필 국조 1.14, 색인 1권_2 p.18~19)과 상충: 1권 원문 대조']]},
 {c:['01:12~01:46','3군단','3군단장이 01:12 포고령 교육·군경합동검문소 「즉각 의명 운용 준비」, 01:45~01:46 지자체 협조관 전개 등을 계속 지시(멀티톡 기재). 3군단장: 「국회 계엄 해제 의결을 인지하지 못했고」','5권_1 p.14~15','비교 ◎']},
 {c:['01:20','수도군단','군단-사단 회의: 「포고문 관련 대대장급 이상 지휘관 숙독하고 내용 중 군 장병이 행동화 해야 되는 부분 교육」','3권_2 p.25','비교 ◎']},
 {c:['01:22~02:01','7군단 예하','7공병여단 01:22 포고령 교육 지시·01:30 교육 완료, 수기사 01:25 장병 교육 지시·02:01 완료 여부 보고 지시','3권_7 p.4~6','▲']},
 {c:['01:34','53사단','사단 단편명령 24-12호(경계태세 2급 조치부호) 하달, 계엄상황실 개소 준비 실시','9권_11-3 p.6','비교']},
 {c:['시각 미상~02:30 전','합참 계엄과','이재식→권영환→(정의현→)한영철: 2신속사 201·203여단 출동준비 관련 하달. 한영철은 02:00~03:00경 문의했다고 진술, 권영환·이재식은 의결 이후로 진술. 소요시간·가용병력 파악 요청 여부는 진술이 갈림','8권_2-2 p.29~30; 8권_2-3 p.26~29; 11권_1-1 p.16~18','박재열 무관 ※']},
 {c:['02:15','합참→2신속사','한영철이 오정태에게 전화해 예하 부대 위치 문의(오정태 검찰 진술을 인용한 질문문)','8권_2-3 p.28','박재열 무관']},
 {c:['02:17~02:22','지작사↔합참','강호필의 주성운 통화(02:17 발신 54초, 주성운은 통화한 기억이 없다고 진술), 김명수 합참의장 통화(02:19~02:22). 김명수는 「강호필에게 병력을 움직이면 안된다고 했다」고 진술. 2신속사에 계엄사 연락이 가기(02:30) 전의 통화','7권_6 p.23','박재열 무관(통화 당사자로 기재되지 않음). 시간대별 정리표 인용, 작성 주체는 인용 쪽에서 확인되지 않음']},
 {c:['02:30','합참 계엄상황실→2신속사','한영철(합참 대테러작전계획담당)이 오정태(2신속사 작전참모)에게 유선으로 201·203여단 출동준비 가능 여부 문의 및 출동준비 요청. 7군단 경유 여부는 부록 C 5번','11권_2-3 p.5·15·49; 11권_2-1 p.7·13; 11권_1-2 p.18·26','2신속사 직통']},
 {c:['02:39(02:40)','2신속사→7군단','사단장→군단장 지휘보고. 2사단 최초본·임태호 p.14는 02:39, 수정본·7군단 답변·임태호 p.8은 02:40','11권_2-3 p.49·50; 11권_2-1 p.8·14; 11권_2-4 p.2','※ 시각']},
 {c:['02:39 이후','7군단','박재열: 「대기해라. 내가 지작사에 확인하겠다」. 임태호는 「그럼 뭘 도와줄까, 차량 지원」「해프닝」 발언도 진술하나 박재열은 기억 없음','11권_2-3 p.40·43~44; 11권_2-1 p.14','▲ ※']},
 {c:['02:42','7군단→지작사','군단장→지작사 참모장(→사령관) 보고. 권대원 진술은 박재열의 전화로 시작','11권_2-3 p.4·50; 11권_2-4 p.2','◎']},
 {c:['02:42~02:52','지작사','강호필이 작전본부장(이승오)에게 확인. 안보폰 통화내역: 02:45:42 지작사령관→작전본부장(종료 02:47:36), 02:51:13 작전본부장→지작사령관(종료시각 OCR 불명)','11권_2-3 p.4·50; 10권_9-3 p.51','◎']},
 {c:['02:52','지작사령관','「201·203여단의 출동준비를 일체 하지 않도록」 지시(2사단 수정본·7군단 답변). 강호필 변호인은 02:50로 기재(색인)','11권_2-3 p.16·50; 11권_2-4 p.2','※ 확인/색인'],f:[['ORIG','매핑표 6절 6번','강호필 변호인 의견서 9권_9(02:50)는 색인']]},
 {c:['02:53','7군단→2신속사','군단장→사단장. 최초본은 「지작사 참모장 확인결과 합참에서 출동준비 요청 없었음」 공유, 수정본·7군단 답변은 「출동준비를 일체 하지 않도록」 지시','11권_2-3 p.49·50; 11권_2-4 p.2','※ 내용']},
 {c:['02:57~02:58','2신속사','사단장↔육본 정책실장 통화(「병력이 필요없어요, 휴식 취하세요」, 최초본은 「현 상태에서 출동준비 활동 중지」). 사단장→군단장 보고 02:58(최초본 「군단장 지시사항 접수: 출동준비 관련 활동 중지」)','11권_2-3 p.49; 11권_2-1 p.8·14','※ 02:57/02:58']},
 {c:['02:58경','7군단','박재열: 「차라리 그냥 애들 재워라」(본인). 김종연: 「다 재워라」 정도 발언, 시각은 기억 불명(p.12). 김종연은 p.7에서 「04경 쯤」 군단장의 군단 전체 취침 지시도 기억','11권_2-3 p.40; 11권_2-2 p.7·12','본인·참모 진술']},
 {c:['03:00경','2신속사 예하','사단장 지시 전파(출동준비 중지·병력 취침). 은명훈: 「군단에서 출동하지 않도록 다 조치가 되었으니 … 모든 임무를 중지하고 다 재워라」','11권_2-3 p.49; 11권_1-2 p.20·40','◎']},
 {c:['03:21','국방부장관','김용현이 상황 해제 선포(영장 서술)','9권_5 p.35~36','중립']},
 {c:['04:20','지작사','강호필 추가 작전지침','9권_5 p.36','중립']},
 {c:['04:35~04:57','수도군단·2군단','수도군단 04:35 「포고문 교육은 현시간부 중지」, 2군단 04:57 포고령 제1호 교육 중지','3권_2 p.25; 11권_1-1 p.6','비교']},
 {c:['04:38~04:45','7군단','군단장 주관 지휘관 회의: 「포고령 관련 계엄과 관련된 사항에 대해 교육하는 것은 불필요」','3권_7 p.4','◎']},
 {c:['04:45','2신속사','전투참모단(-) 운영, 기타 인원 휴식','11권_2-3 p.49','중립']},
 {c:['사후(시각 ✕)','7군단','국회 국방위 김병주·복지위 백혜련 의원 요구자료 답변 수정 제출: 「02:30경 계엄사 한00 중령으로부터 … 출동준비 요청을 받은 사항」, 「출동한 사실이 없으며 출동준비를 한 사항이 없음」. 작전처장 전결. 최초 제출 시점은 문서에서 확인되지 않음','11권_2-4 p.1~2·6','▲']},
 {c:['사후(시각 ✕)','7군단','성은경 보고: 박서호가 상황일지의 「2신속대응사단」 삭제 가능 여부를 문의, 법무실장이 만류, 국회에는 「그런 적 없다」는 답변이 이미 나간 상태','11권_1-2 p.44~46','※']}
 ]},
C:{lab:'부록 C',title:'부록 C. 서로 상충하는 기록',lead:'어느 쪽이 맞는지 판단하지 않고 기록을 나란히 둡니다.',

 {c:['1','국회 해제 의결 시각','01:03경 — 9권_5 p.35(영장 서술), 11권_1-1 p.18(질문문)','01:01 — 강호필 국조 1.14 발언(색인 1권_2 p.18~19)','강호필 국조 2.21 발언은 01:03(색인). 1권 원문은 이 문서 세트에 없어 대조 불가'],f:[['ORIG','매핑표 6절 5번','1권 원문 대조']]},
 {c:['2','지작사 회의 시각·지시 문구','영장: 00:40~00:55 「신속대응사단은 의명 투입준비태세 유지」 — 9권_5 p.35','7군단 일지 00:55 「합참 대테러부대 출동태세 유지(의명, 2신속대응사단)」 — 10권_9-2 p.29~30, 11권_2-1 p.27(질문문)','3군단 멀티톡 01:02 11항 「신속대응사단은 의명 투입준비태세 유지」 — 6권_1 p.31. 수도군단 일지 00:30(1차 평가) 「신속대응부대 즉각 의명 투입준비태세 유지」 — 10권_9-3 p.52(질문문). 1군단 일지는 「합참 대테러작전부대 투입 준비」와 「신속대응사단 투입 준비」를 모두 기재 — 10권_9-2 p.30(질문문). 일지 원문은 미확인. 7권_6 p.22(시간대별 정리표)는 3군단 멀티톡·수도군단 일지를 근거로 지작사령관 주요 지시·강조사항을 00:36~00:44, 예하 군단장·사단장 계엄상황실 개소 보고를 00:47~00:55로 정리. 공소장: 「제2신속대응사단은 출동을 준비하라」 — 공소장 p.23. 7군단 일지 작성자(색인상 임재순): 「2신속대응사단은 언제든 출동할 수 있게 준비해라」 — 6권_2 p.15. 김종연: 「의명 … 출동할 수 있으니 대기하라는 정도」 — 11권_2-2 p.9. 강호필: 출동준비 지시를 하지 않았다 — 9권_1-2 p.32']},
 {c:['3','박재열 01:00~01:10 지시 내용','영장: 「국회 의결에도 불구하고 계엄군 임무 수행을 할 수 있도록 준비할 것, 제2신속대응사단은 임무 부여 시 즉각 투입될 수 있도록 준비할 것」 — 9권_5 p.35. 일지 01:10 항도 같은 취지 — 11권_2-4 p.3','박재열: 「추후 명령이 내려오면 출동준비를 하라고 지시한 것 외에 지금 출동준비를 하라고 지시한 적은 없다 … 의명 출동준비라는 상황을 2사단에 공유한 차원」 — 11권_2-3 p.45','임태호 8.4: 「2신속대응사단 출동 준비를 잘 해라 … 예하 부대에 준비 지시」 — 11권_2-1 p.13 / 임태호 4.6.: 01시 지시 언급 없음 — 11권_1-2 p.17~20. 김종연: 「의명 임무부여시 즉각 투입될 수 있도록 준비하라는 것은 군단장님이 지시한 거 같습니다. 계엄군 임무수행을 할 수 있도록 준비하라는 문구는 … 기억이 나지 않습니다」 — 11권_2-2 p.10. 박서호: 「지작사 지침을 그대로 받아서 전파」 — 11권_2-1 p.28~30. 임재순: 군단장이 2신속사단장에게 「계엄군 임무를 수행할 수 있기 때문에 즉각 투입될 수 있도록 준비」 지시 — 6권_2 p.16']},
 {c:['4','「계엄군 임무수행」 문구의 출처','영장: 강호필이 중지 지침을 하달하지 않아 「이에 따라」 박재열이 지시 — 9권_5 p.35','군검사 질문: 계엄 임무 없는 7군단장이 「지작사령관의 지시도 있지 않았는데, 독자적으로」 — 11권_2-3 p.37','박재열: 7.16 「지작사령관 지시가 아니라 내 판단」(p.23~26 피신 인용), 8.10 「제가 생각해서 말한 내용」(p.36~37). 박서호: 「독단적으로 7군단장이 투입 준비 지시한 것으로는 보이지 않습니다」 — 11권_2-1 p.29~30']},
 {c:['5','계엄사가 7군단에 처음 연락한 경로·시각','박서호: 01~02시경 계엄사가 7군단 지통실에 전화, 「서면 명령으로 정식 하달」 건의 — 11권_2-1 p.24~25','박재열: 02:30경이 최초이고 2사단장 보고가 먼저 — 11권_2-3 p.34','7군단 국회 답변: 02:30경 계엄사 → (2신속사), 02:40 사단장 → 군단장 — 11권_2-4 p.2. 2사단 최초본: 02:30 계엄상황실 → 2신속사 작전참모 유선 — 11권_2-3 p.49. 한영철·권영환·정의현 진술은 2신속사 직통만 언급 — 8권_2-3, 11권_1-1']},
 {c:['6','사단장 → 군단장 보고 시각','02:39 — 2사단 최초본(11권_2-3 p.49), 임태호 p.14(11권_2-1)','02:40 — 지작사 수정본(11권_2-3 p.50), 7군단 답변(11권_2-4 p.2), 임태호 p.8(11권_2-1)','임태호 한 사람의 진술 안에서도 p.8과 p.14가 다름']},
 {c:['7','출동준비 ‘중지’ 지시의 주체·시각·내용','지작사령관 02:52 「일체 하지 않도록」 — 11권_2-3 p.16·50, 11권_2-4 p.2, 권대원 11권_2-3 p.13(「02:52에 이미 지시」)','02:50 — 강호필 변호인(색인 9권_9)','02:53 군단장 → 사단장: 최초본은 「지작사 참모장 확인결과 합참에서 출동준비 요청 없었음」 공유(11권_2-3 p.49), 수정본·7군단 답변은 「일체 하지 않도록」 지시(p.50, 11권_2-4 p.2). 02:57 사단장 ↔ 육본 정책실장 「병력이 필요없어요, 휴식 취하세요」(임태호 p.14), 최초본은 「현 상태에서 출동준비 활동 중지」. 02:58 사단장 → 군단장 최초본 「군단장 지시사항 접수」 / 임태호 p.14 「출동준비 하는 것을 중지하겠습니다」 보고 → 「알겠다」. 박재열: 「출동준비 중지는 제가 이미 지시 … 저에게 중지를 건의하지 않았다」(p.44~45). 박서호·김종연: 중지 지시 기억 없음, 「생활관에서 휴식 대기」「다 재워라」(11권_2-1 p.25~26, 11권_2-2 p.12). 김종연은 별도로 「04경 쯤 시간이 좀 지난 후 군단장이 군단 전체 취침시켜라」 지시를 기억(11권_2-2 p.7)'],f:[['ORIG','매핑표 6절 6번','9권_9(02:50)는 색인']]},

    const fl=[];
    rows.forEach(r=>(r.f||[]).forEach(f=>{
      const pre=(key==='B'?r.c[0]:r.c[0]+'번')+' · ';
      if(!fl.some(x=>x[0]===f[0]&&x[1]===f[1]&&x[2]===pre+f[2]))fl.push([f[0],f[1],pre+f[2]]);
    }));
    return{id:key+(i+1),ref:app.lab,part:'x',lay:'tab',title:`${app.title} (${i+1}/${groups.length})`,lead:i===0?app.lead:'',tab:{cols:app.cols,w:app.w,rows:rows},fl};
  });
}
const ALL=[];
SL.forEach(s=>{
  if(s.split&&s.cards){
    const per=Math.ceil(s.cards.length/s.split);
    for(let i=0;i<s.split;i++){
      const o=Object.assign({},s,{cards:s.cards.slice(i*per,(i+1)*per),title:s.title+` (${i+1}/${s.split})`,grid:'big',cols:2,id:i?s.ref+'-'+(i+1):s.ref,lead:i?'':s.lead});
      if(i)o.noWork=true;
      ALL.push(o);
    }
  }else{s.id=s.ref;ALL.push(s)}
});
ALL.push({id:'toc',ref:'31',part:'x',lay:'toc',title:'부록',lead:'발표 본편은 여기까지입니다. 아래는 반론·질의 대비용 자료와 작업용 목록입니다.',
  toc:[
   {h:'출처 목록',t:'본편 슬라이드가 인용한 파일과 쪽, 확인·색인 구분',to:'src'},
   {h:'부록 A. 불리한 자료와 대응',t:'본편에서 뺀 불리한 자료 15건과 대응 논점',to:'A1'},
   {h:'부록 B. 기준 시간선 상세',t:'조직별 시간선 33행(12.3 22:40 ~ 12.4 04:45)',to:'B1'},
   {h:'부록 C. 서로 상충하는 기록',t:'기록끼리 어긋나는 13개 쟁점. 어느 쪽이 맞는지 판단하지 않고 병기',to:'C1'},
   {h:'수정 대기 목록 (작업용)',t:'공소장 반영 검토, 공소장 1~20쪽 대조, 원문 확인이 남은 항목. 발표 시에는 건너뜁니다',to:'W1'}]});
ALL.push({id:'src',ref:'31',part:'x',lay:'src',title:'출처 목록',lead:'본편 슬라이드가 인용한 파일과 쪽입니다. 표시는 매핑표 작업 기준입니다.',
  fl:[['ORIG','매핑표 6절 6번','색인·검색 발췌·성명 미확인으로 표시된 출처는 원문 쪽을 열람해 ‘확인’으로 올림']]});
['A','B','C'].forEach(k=>chunkApp(k,APP[k]).forEach(s=>ALL.push(s)));

/* 수정 대기 목록(작업용 슬라이드) 만들기: 번호를 먼저 매기고 항목을 모음 */
ALL.forEach((s,i)=>{s.no=i+1;BY[s.id]=s});
function shortT(s){const t=s.title.replace(/^부록 [A-C]\. /,'');return t.length>30?t.slice(0,30)+'…':t}
const entries={};
ALL.forEach(s=>!s.noWork&&(s.fl||[]).forEach(f=>{(entries[f[0]]=entries[f[0]]||[]).push({id:s.id,no:s.no,t:shortT(s),ref:f[1],note:f[2]})}));
function workSlides(){
  const out=[];let n=1;
  const mk=(title,list,extra)=>{const per=14;for(let i=0;i<list.length||i===0;i+=per){
    const part=list.slice(i,i+per);const tot=Math.ceil(list.length/per)||1;
    out.push(Object.assign({id:'W'+(n++),ref:'7절',part:'w',work:true,lay:'work',title:`${title}${tot>1?` (${i/per+1}/${tot})`:''}`,entries:part},i===0?extra:{}));}};
  mk('수정 대기 목록 · 공소장 반영 검토',entries.NEW||[],{lead:'2026.10.24 공소장 21~23쪽(사진)을 반영해 고친 슬라이드입니다. 판독문(Project 문서 claude/공소장_박재열_p21-23_판독.md)과 대조해 확인한 뒤 표시를 지우면 됩니다.'});
  mk('수정 대기 목록 · 공소장 대조(1~20쪽)',entries.FIX||[],{lead:'공소장 1~20쪽(피고인 사항·죄명·적용법조, 강호필 부분)을 받은 뒤 대조할 곳입니다.'});
  mk('수정 대기 목록 · 원문 확인',entries.ORIG||[],{lead:'색인·발췌·인용으로만 확인한 내용입니다. 원문 쪽을 열어 대조한 뒤 ‘확인’으로 올립니다.'});
  mk('수정 대기 목록 · 법리·OCR·추론·확정 보류',[].concat(entries.LAW||[],entries.OCR||[],entries.INFER||[],entries.HOLD||[]).map((e,i,a)=>e),{lead:'법리 확인, OCR 불명 단어 대조, 추론 구분, 추후 확정 표시가 붙은 슬라이드입니다.'});
  return out;
}
/* 유형 라벨 포함하도록 마지막 그룹은 항목에 유형을 덧붙임 */
['LAW','OCR','INFER','HOLD'].forEach(t=>(entries[t]||[]).forEach(e=>{e.note='['+FL[t][1]+'] '+e.note}));
workSlides().forEach(w=>ALL.push(w));
ALL.forEach((s,i)=>{s.no=i+1;BY[s.id]=s});
const N=ALL.length;

/* ---------- 화면 만들기 ---------- */
const canvas=$('#canvas'),fitEl=$('#fit'),stage=$('#stage'),root=document.documentElement;
canvas.innerHTML=ALL.map(s=>shell(s,N)).join('');
ALL.forEach(s=>{s.el=$('#sl-'+s.no)});
$$('.goto em').forEach((e,i)=>{const t=ALL.find(s=>s.id==='toc').toc[i];e.textContent='슬라이드 '+BY[t.to].no});

let noflags=false,cur=0;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const vis=()=>ALL.filter(s=>!(noflags&&s.work));
function show(sl){
  const list=vis();let i=list.indexOf(sl);if(i<0){i=list.length-1;sl=list[i]}
  ALL.forEach(s=>s.el.classList.toggle('on',s===sl));
  cur=ALL.indexOf(sl);
  $('#cnt').textContent=`${i+1} / ${list.length}`;
  $('#prev').disabled=i===0;$('#next').disabled=i===list.length-1;
  document.title='박재열 변론 슬라이드';
  if(root.classList.contains('reader'))window.scrollTo(0,0);
  lsSet('deck565.cur',sl.id);
}
function step(d){const list=vis();const i=list.indexOf(ALL[cur]);const j=Math.max(0,Math.min(list.length-1,(i<0?0:i)+d));show(list[j])}
function goId(id){const s=BY[id];if(s){closeOv();show(s)}}

function fit(){
  const reader=window.matchMedia('(max-width: 820px)').matches;
  root.classList.toggle('reader',reader);
  if(reader){fitEl.style.width='';fitEl.style.height='';canvas.style.transform='';return}
  const r=stage.getBoundingClientRect();
  const sc=Math.max(.2,Math.min(r.width/1280,r.height/720));
  fitEl.style.width=1280*sc+'px';fitEl.style.height=720*sc+'px';
  canvas.style.transform=`scale(${sc})`;
}

/* 수정 표시 켜기/끄기 */
function setFlags(on){
  noflags=!on;document.body.classList.toggle('noflags',noflags);
  $('#bFl').setAttribute('aria-pressed',on?'true':'false');
  lsSet('deck565.flags',on?'1':'0');
  show(ALL[cur]);
}

/* 전체 보기 */
const ov=$('#ov'),ovIn=$('#ovIn');
function openOv(){
  const list=vis();let last='',html='',open=false;
  list.forEach(s=>{
    if(s.part!==last){last=s.part;if(open)html+='</div>';html+=`<h3>${PART[s.part]}</h3><div class="ovg">`;open=true}
    const types=FORD.filter(t=>(s.fl||[]).some(f=>f[0]===t));
    const t=s.lay==='cover'?s.title:(s.title.length>70?s.title.slice(0,70)+'…':s.title);
    const mr=(s.part==='a'||s.part==='b'||s.part==='c'||s.part==='d')?(/^S/.test(s.ref)?' · 신설':' · 매핑표 '+s.ref):'';
    html+=`<button class="ovc${s===ALL[cur]?' cur':''}" data-go="${s.id}"><span class="ovn">${s.no}${mr}</span><span class="ovt">${esc(t)}</span><span class="ovf">${types.map(x=>`<span class="dotf ${FL[x][0]}" title="${FL[x][1]}"></span>`).join('')}</span></button>`;
  });
  if(open)html+='</div>';
  ovIn.innerHTML=`<div class="ov-h"><h2>전체 슬라이드 ${list.length}장</h2><span class="sp"></span><button class="btn" id="ovX">닫기</button></div>`+html;
  ov.hidden=false;
  const c=$('.ovc.cur',ovIn);if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'});
}
function closeOv(){ov.hidden=true}

/* 범례 */
const lg=$('#lg');
function openLg(){
  const F=(t,d)=>`<div class="lgr"><span class="fchip ${FL[t][0]}">${FL[t][1]}</span><span>${d}</span></div>`;
  $('#lgP').innerHTML=`<div class="ov-h"><h2>범례</h2><span class="sp"></span><button class="btn" id="lgX">닫기</button></div>
  <h3>근거의 성격</h3>
  <div class="lgr"><span class="mkc" style="background:var(--good-soft);color:var(--good)">◎ 유리</span><span>박재열에게 유리한 자료</span></div>
  <div class="lgr"><span class="mkc" style="background:var(--bad-soft);color:var(--bad)">▲ 불리</span><span>박재열에게 불리하거나 특검·강호필 측이 쓸 자료</span></div>
  <div class="lgr"><span class="mkc" style="background:var(--warn-soft);color:var(--warn)">※ 상충·주의</span><span>기록끼리 어긋나거나 OCR이 불명확해 원문 확인이 필요한 항목</span></div>
  <div class="lgr"><span class="mkc" style="background:var(--none-soft);color:var(--none)">✕ 미확인</span><span>문서에서 확인되지 않음</span></div>
  <h3>출처 칩</h3>
  <div class="lgr"><span class="src"><b>11권_2-3</b> p.27</span><span>이번 작업에서 해당 쪽을 열어 대조함(확인)</span></div>
  <div class="lgr"><span class="src st-i"><b>9권_9</b><i>색인</i></span><span>색인표 기재를 따름. 인용 전에 원문 대조 필요</span></div>
  <div class="lgr"><span class="src st-x"><b>11권_1-3</b> p.28<i>발췌</i></span><span>검색으로 얻은 발췌</span></div>
  <div class="lgr"><span class="src st-n"><b>6권_2</b> p.15<i>성명 미확인</i></span><span>진술인 성명이 인용 쪽에서 확인되지 않음</span></div>
  <div class="lgr"><span class="src st-q"><b>11권_2-4</b> p.3<i>질문문</i></span><span>군검사 질문문에 인용된 내용(원문 자체는 아님)</span></div>
  <h3>수정 표시 (상단 줄무늬와 하단 메모 상자)</h3>
  ${F('NEW','2026.10.24 공소장 21~23쪽을 반영해 고친 곳. 판독문과 대조해 검토')}
  ${F('FIX','공소장 1~20쪽(죄명·적용법조, 강호필 부분)을 받은 뒤 대조할 곳')}
  ${F('ORIG','색인·발췌·인용으로만 확인한 내용. 원문을 열어 대조')}
  ${F('LAW','문서에서 확인되지 않는 법리. 변호인 판단')}
  ${F('OCR','OCR 불명 단어. 원본 이미지 대조')}
  ${F('INFER','기록과 추론이 섞인 부분. 구분해서 발표')}
  ${F('HOLD','일단 포함하되 나중에 확정')}
  <h3>키보드</h3>
  <div class="lgr"><span><b>← →</b></span><span>이전·다음 슬라이드 (Space, PageUp/PageDown도 가능)</span></div>
  <div class="lgr"><span><b>G</b></span><span>전체 보기</span></div>
  <div class="lgr"><span><b>F</b></span><span>수정 표시 켜기/끄기</span></div>
  <div class="lgr"><span><b>L · Esc</b></span><span>범례 열기 · 닫기</span></div>`;
  lg.hidden=false;
}
function closeLg(){lg.hidden=true}

/* ---------- 이벤트 ---------- */
$('#prev').addEventListener('click',()=>step(-1));
$('#next').addEventListener('click',()=>step(1));
$('#bOv').addEventListener('click',openOv);
$('#bLg').addEventListener('click',openLg);
$('#bFl').addEventListener('click',()=>setFlags(noflags));
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]');
  if(t){e.preventDefault();goId(t.getAttribute('data-go'));return}
  if(e.target.id==='ovX')closeOv();
  if(e.target.id==='lgX'||e.target===lg)closeLg();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='Escape'){closeOv();closeLg();return}
  if(!ov.hidden||!lg.hidden)return;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();step(1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();step(-1)}
  else if(k==='Home'){show(vis()[0])}
  else if(k==='End'){const l=vis();show(l[l.length-1])}
  else if(k==='g'||k==='G'){openOv()}
  else if(k==='f'||k==='F'){setFlags(noflags)}
  else if(k==='l'||k==='L'){openLg()}
});
let px=0,py=0;
stage.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY});
stage.addEventListener('pointerup',e=>{
  const dx=e.clientX-px,dy=e.clientY-py;
  if(Math.abs(dx)>70&&Math.abs(dy)<45&&e.pointerType!=='mouse')step(dx<0?1:-1);
});
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);

/* ---------- 시작 ---------- */
if(lsGet('deck565.flags')==='0'){noflags=true;document.body.classList.add('noflags');$('#bFl').setAttribute('aria-pressed','false')}
fit();
let start=ALL[0];
const h=(location.hash||'').match(/^#s(\d+)$/);
if(h&&ALL[+h[1]-1])start=ALL[+h[1]-1];
else{const saved=lsGet('deck565.cur');if(saved&&BY[saved]&&!(noflags&&BY[saved].work))start=BY[saved]}
show(start);
})();
</script>
</body>
</html>
